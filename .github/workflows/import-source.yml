name: Import complete SNES source

on:
  push:
    branches: [main]
    paths:
      - "import-payload/**"

permissions:
  contents: write

concurrency:
  group: snes-source-import
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout carrier commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified project history
        shell: bash
        run: |
          set -euo pipefail
          cat import-payload/part-* > /tmp/snes-source.bundle
          echo "66ea53615c96d96f9577a8c3c2695b5c8df82c3e6b76e533b4b46e4c8f16b71d  /tmp/snes-source.bundle" | sha256sum --check --strict
          git bundle verify /tmp/snes-source.bundle
          git fetch /tmp/snes-source.bundle refs/heads/github-export:refs/remotes/site/github-export
          test "$(git rev-parse refs/remotes/site/github-export)" = "90a779c2fcfe9818ebb767785ff90a3c17dc46ea"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --allow-unrelated-histories --no-commit --no-ff refs/remotes/site/github-export
          git rm -r -f import-payload .github/workflows/pages.yml
          git commit -m "Import complete SNES PAL collection manager 0.2"
          git push origin HEAD:main
