<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>SNES PAL Sammlung</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#151c31;--panel2:#1d2742;--text:#f5f7ff;--muted:#aab3ce;--accent:#e63946;--ok:#22c55e;--line:#2b3658}
    *{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0b1020,#111827);color:var(--text);min-height:100vh}
    header{padding:calc(22px + env(safe-area-inset-top)) 18px 18px;background:#0d1325dd;backdrop-filter:blur(14px);position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}
    h1{font-size:1.35rem;margin:0 0 4px}.sub{color:var(--muted);font-size:.9rem}.wrap{max-width:1050px;margin:auto;padding:18px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:1.35rem}.stat span{color:var(--muted);font-size:.82rem}
    .toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:14px}input,select,button{font:inherit;border-radius:11px;border:1px solid var(--line);padding:11px 12px;background:var(--panel);color:var(--text)}button{cursor:pointer;font-weight:650}.primary{background:var(--accent);border-color:var(--accent)}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:10px}.title{font-weight:750}.meta{color:var(--muted);font-size:.88rem;margin-top:4px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--panel2);margin:5px 5px 0 0;font-size:.78rem}.owned{color:#b7f7c7}.actions{display:flex;gap:7px;align-items:start}.icon{padding:8px 10px}
    .empty{text-align:center;color:var(--muted);padding:48px 15px;border:1px dashed var(--line);border-radius:15px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:end center;z-index:5}.modal.open{display:grid}.sheet{width:min(680px,100%);background:var(--panel);border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form .full{grid-column:1/-1}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    @media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.card{grid-template-columns:1fr}.actions{justify-content:flex-end}.form{grid-template-columns:1fr}.form .full{grid-column:auto}}
  </style>
</head>
<body>
<header><div class="wrap" style="padding:0"><h1>🎮 SNES PAL Sammlung</h1><div class="sub">Dein privater Sammlungsmanager – Daten bleiben auf diesem Gerät.</div></div></header>
<main class="wrap">
  <section class="stats">
    <div class="stat"><b id="count">0</b><span>Spiele gesamt</span></div>
    <div class="stat"><b id="complete">0</b><span>Komplett (CIB)</span></div>
    <div class="stat"><b id="value">0 €</b><span>Sammlungswert</span></div>
  </section>
  <section class="toolbar">
    <input id="search" placeholder="Spiel suchen …" aria-label="Spiel suchen">
    <select id="filter" aria-label="Filter"><option value="all">Alle</option><option value="owned">Vorhanden</option><option value="missing">Nicht vorhanden</option><option value="cib">Komplett (CIB)</option></select>
    <button class="primary" id="add">＋ Spiel</button>
  </section>
  <div id="list"></div>
  <div class="row"><button id="export">Export</button><button id="importBtn">Import</button><input hidden type="file" id="importFile" accept="application/json"></div>
</main>
<div class="modal" id="modal"><div class="sheet"><h2 id="formTitle">Spiel hinzufügen</h2><div class="form">
  <input class="full" id="name" placeholder="Titel" required>
  <input id="publisher" placeholder="Publisher">
  <input id="year" type="number" min="1990" max="2000" placeholder="Jahr">
  <select id="region"><option>PAL-DE</option><option>PAL-EU</option><option>PAL-UK</option><option>PAL-FR</option><option>PAL-IT</option><option>PAL-ES</option><option>PAL-AUS</option></select>
  <select id="condition"><option value="loose">Modul</option><option value="boxed">Modul + OVP</option><option value="cib">Komplett (CIB)</option><option value="sealed">Neu/verschweißt</option></select>
  <input id="price" type="number" min="0" step="0.01" placeholder="Richtwert €">
  <select id="owned"><option value="true">Vorhanden</option><option value="false">Nicht vorhanden</option></select>
  <input class="full" id="notes" placeholder="Notizen">
</div><div class="row"><button id="cancel">Abbrechen</button><button class="primary" id="save">Speichern</button></div></div></div>
<script>
const KEY='snes-pal-sammlung-v1';let games=JSON.parse(localStorage.getItem(KEY)||'[]'),editId=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(games));render()}
function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;let rows=games.filter(g=>g.name.toLowerCase().includes(q)||String(g.publisher||'').toLowerCase().includes(q)).filter(g=>f==='all'||(f==='owned'&&g.owned)||(f==='missing'&&!g.owned)||(f==='cib'&&g.condition==='cib'));
 $('count').textContent=games.filter(g=>g.owned).length;$('complete').textContent=games.filter(g=>g.owned&&g.condition==='cib').length;$('value').textContent=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(games.filter(g=>g.owned).reduce((a,g)=>a+(Number(g.price)||0),0));
 $('list').innerHTML=rows.length?rows.sort((a,b)=>a.name.localeCompare(b.name,'de')).map(g=>`<article class="card"><div><div class="title">${esc(g.name)}</div><div class="meta">${esc(g.publisher||'Unbekannter Publisher')}${g.year?' · '+esc(g.year):''}</div><span class="badge">${esc(g.region)}</span><span class="badge">${({loose:'Modul',boxed:'Mit OVP',cib:'Komplett (CIB)',sealed:'Neu/OVP'})[g.condition]}</span><span class="badge ${g.owned?'owned':''}">${g.owned?'✓ Vorhanden':'Fehlt'}</span>${g.price?`<span class="badge">${Number(g.price).toLocaleString('de-DE',{minimumFractionDigits:2})} €</span>`:''}${g.notes?`<div class="meta">${esc(g.notes)}</div>`:''}</div><div class="actions"><button class="icon" onclick="editGame('${g.id}')">✎</button><button class="icon" onclick="delGame('${g.id}')">🗑</button></div></article>`).join(''):'<div class="empty">Noch keine passenden Spiele eingetragen.</div>'}
function openForm(g){editId=g?.id||null;$('formTitle').textContent=g?'Spiel bearbeiten':'Spiel hinzufügen';['name','publisher','year','price','notes'].forEach(k=>$(k).value=g?.[k]??'');$('region').value=g?.region||'PAL-DE';$('condition').value=g?.condition||'loose';$('owned').value=String(g?.owned??true);$('modal').classList.add('open')}
window.editGame=id=>openForm(games.find(g=>g.id===id));window.delGame=id=>{if(confirm('Spiel wirklich löschen?')){games=games.filter(g=>g.id!==id);persist()}};
$('add').onclick=()=>openForm();$('cancel').onclick=()=> $('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
$('save').onclick=()=>{const name=$('name').value.trim();if(!name)return alert('Bitte einen Titel eingeben.');const g={id:editId||crypto.randomUUID(),name,publisher:$('publisher').value.trim(),year:$('year').value,region:$('region').value,condition:$('condition').value,price:Number($('price').value)||0,owned:$('owned').value==='true',notes:$('notes').value.trim()};games=editId?games.map(x=>x.id===editId?g:x):[...games,g];$('modal').classList.remove('open');persist()};
$('search').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(games,null,2)],{type:'application/json'}));a.download='snes-pal-sammlung.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw 0;games=data;persist()}catch{alert('Die Datei konnte nicht importiert werden.')}};render();
</script>
</body></html>
